<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RevAI — AI Code Review Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #121826;
      --bg-card: #182234;
      --bg-card-hover: #1f2c42;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --critical: #ef4444;
      --major: #f59e0b;
      --minor: #38bdf8;
      --suggestion: #818cf8;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 800;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: -0.5px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #0ea5e9);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    /* Hero Score Grid */
    .hero-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
    }

    .score-card-hero {
      background: linear-gradient(145deg, #182234, #121826);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .score-card-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #10b981);
    }

    .gauge-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 16px 0;
    }

    .gauge-svg {
      transform: rotate(-90deg);
      width: 160px;
      height: 160px;
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 10;
    }

    .gauge-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gauge-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge-score {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }

    .gauge-grade {
      font-size: 14px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .grade-A { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .grade-B { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .grade-C { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .grade-F { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .status-pill {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .summary-text {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Sub Categories */
    .categories-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .categories-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .categories-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .meta-badges {
      display: flex;
      gap: 12px;
      font-size: 12px;
    }

    .meta-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      color: var(--text-muted);
    }

    .category-bars {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cat-row {
      display: grid;
      grid-template-columns: 140px 1fr 50px;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }

    .cat-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .progress-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1s ease;
    }

    .cat-val {
      font-weight: 700;
      text-align: right;
    }

    /* Filters Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .filter-tabs {
      display: flex;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--bg-card);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Issues Cards */
    .issues-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .issue-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .issue-card:hover {
      border-color: var(--border-accent);
    }

    .issue-card.critical { border-left: 4px solid var(--critical); }
    .issue-card.major { border-left: 4px solid var(--major); }
    .issue-card.minor { border-left: 4px solid var(--minor); }
    .issue-card.suggestion { border-left: 4px solid var(--suggestion); }

    .issue-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
      user-select: none;
    }

    .issue-title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-major { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-minor { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-suggestion { background: rgba(129, 140, 248, 0.2); color: #a5b4fc; }

    .issue-loc {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--accent);
    }

    .issue-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .issue-body {
      padding: 0 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .problem-box {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .why-matters-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #fca5a5;
    }

    .why-matters-box strong {
      color: #f87171;
    }

    .code-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 800px) {
      .code-comparison { grid-template-columns: 1fr; }
    }

    .code-pane {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .pane-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .pane-header.bad { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .pane-header.good { background: rgba(16, 185, 129, 0.15); color: #34d399; }

    pre code {
      display: block;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      color: #e2e8f0;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px dashed var(--border-color);
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo-badge">RevAI</span>
      <h1>AI Code Reviewer</h1>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportMarkdown()">📝 Copy Markdown PR</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
  </header>

  <main>
    <section class="hero-grid">
      <!-- Main Overall Score Card -->
      <div class="score-card-hero">
        <span style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Overall Quality Score</span>
        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 160 160">
            <circle class="gauge-bg" cx="80" cy="80" r="70"></circle>
            <circle class="gauge-progress" id="gaugeCircle" cx="80" cy="80" r="70"></circle>
          </svg>
          <div class="gauge-value">
            <span class="gauge-score" id="scoreNumber">--</span>
            <span class="gauge-grade" id="gradeBadge">--</span>
          </div>
        </div>
        <div class="status-pill" id="statusPill">ANALYZING</div>
        <p class="summary-text" id="summaryText">Evaluating diff against rules...</p>
      </div>

      <!-- Category Breakdown -->
      <div class="categories-panel">
        <div class="categories-header">
          <div>
            <h3>Audit Performance Breakdown</h3>
            <span style="font-size: 12px; color: var(--text-muted);" id="targetSubtext">Target Details</span>
          </div>
          <div class="meta-badges">
            <span class="meta-badge" id="statsFiles">0 files</span>
            <span class="meta-badge" id="statsLines">+0 / -0</span>
            <span class="meta-badge" id="statsRules">0 rules</span>
          </div>
        </div>

        <div class="category-bars" id="categoryBars">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

    <!-- Controls & Filters -->
    <section class="controls-bar">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" onclick="setFilter('all')">All Issues (<span id="countAll">0</span>)</button>
        <button class="filter-btn" onclick="setFilter('critical')">🔴 Critical (<span id="countCrit">0</span>)</button>
        <button class="filter-btn" onclick="setFilter('major')">🟠 Major (<span id="countMaj">0</span>)</button>
        <button class="filter-btn" onclick="setFilter('minor')">🟡 Minor (<span id="countMin">0</span>)</button>
        <button class="filter-btn" onclick="setFilter('suggestion')">🔵 Suggestions (<span id="countSugg">0</span>)</button>
      </div>
      <div>
        <span style="font-size: 13px; color: var(--text-muted);">AI Model: <strong>Google Gemini (Free Tier)</strong></span>
      </div>
    </section>

    <!-- Issues Container -->
    <section class="issues-container" id="issuesList">
      <!-- Injected via JS -->
    </section>
  </main>

  <footer>
    RevAI — 100% Free AI Code Reviewer with Preloaded Rules & Scoring. Built with Google Gemini.
  </footer>

  <script>
    const data = {"title":"Code Review: test/sample.diff","targetDescription":"Sample feature branch: auth-flow-fixes","timestamp":"2026-10-26T10:11:20.884Z","stats":{"filesChanged":2,"additions":24,"deletions":1,"totalLinesChanged":25,"languagesDetected":["dart","ts"],"rulesCheckedCount":21},"score":{"overall":40,"grade":"D","status":"NEEDS_ATTENTION","summary":"Significant defects, security concerns, or poor maintainability detected.","security":{"name":"Security","score":40,"weight":1,"issuesCount":1,"criticalCount":1,"majorCount":0},"performance":{"name":"Performance","score":65,"weight":1,"issuesCount":1,"criticalCount":0,"majorCount":1},"reliability":{"name":"Reliability","score":50,"weight":1,"issuesCount":1,"criticalCount":1,"majorCount":0},"maintainability":{"name":"Maintainability","score":60,"weight":1,"issuesCount":1,"criticalCount":0,"majorCount":1},"rulesAdherence":{"name":"Rules Adherence","score":45,"weight":1,"issuesCount":0,"criticalCount":0,"majorCount":0}},"issues":[{"id":"ISSUE-1","file":"lib/screens/login_screen.dart","lineStart":17,"lineEnd":19,"severity":"critical","category":"reliability","ruleId":"FLUTTER-001","ruleName":"Missing \"mounted\" Check After Async Gap","title":"setState() called after await without mounted check","description":"An async gap exists between http.post and setState(). If the user navigates away before the network request finishes, calling setState will throw FlutterError and crash.","whyItMatters":"Causes unhandled Flutter runtime exceptions in production when users pop the route quickly.","suggestedFix":"Verify \"if (!mounted) return;\" immediately following any await statement before calling setState.","codeSnippet":"final response = await http.post(Uri.parse(...));\nsetState(() { _isLoading = false; });","fixedCodeSnippet":"final response = await http.post(Uri.parse(...));\nif (!mounted) return;\nsetState(() { _isLoading = false; });"},{"id":"ISSUE-2","file":"lib/screens/login_screen.dart","lineStart":10,"lineEnd with required fields.","codeSnippet":"export async function loginUser(payload: any)","fixedCodeSnippet":"interface LoginPayload {\n  role: number;\n  username: string;\n}\n\nexport async function loginUser(payload: LoginPayload)"}],"positiveHighlights":["Clean separation of concerns with asynchronous network login call","Proper use of StatefulWidget for managing dynamic login state"],"rawDiffSnippet":"diff --git a/lib/screens/login_screen.dart b/lib/screens/login_screen.dart\nindex e69de29..b2b1a20 100644\n--- a/lib/screens/login_screen.dart\n+++ b/lib/screens/login_screen.dart\n@@ -1,15 +1,28 @@\n import 'package:flutter/material.dart';\n+import 'package:http/http.dart' as http;\n \n class LoginScreen extends StatefulWidget {\n   @override\n   _LoginScreenState createState() => _LoginScreenState();\n }\n \n class _LoginScreenState extends State\u003cLoginScreen> {\n+  final TextEditingController _passwordController = TextEditingController();\n+  bool _isLoading = false;\n+\n+  Future\u003cvoid> _submitLogin() async {\n+    setState(() { _isLoading = true; });\n+    final response = await http.post(Uri.parse('https://api.example.com/login'));\n+    // Bug: Missing mounted check across async gap!\n+    setState(() {\n+      _isLoading = false;\n+    });\n+  }\n+  // Bug: _passwordController is never disposed!\n+\n   @override\n   Widget build(BuildContext context) {\n     return Scaffold(\n       body: Center(\n         child: ElevatedButton(\n           onPressed: _submitLogin,\n           child: Text(\"Login\"),\ndiff --git a/src/services/auth.ts b/src/services/auth.ts\nindex e69de29..c3a1b40 100644\n--- a/src/services/auth.ts\n+++ b/src/services/auth.ts\n@@ -1,5 +1,12 @@\n-export function verifyToken() {}\n+export const JWT_SECRET = \"sk_live_super_secret_production_key_123456\";\n+\n+export async function loginUser(payload: any) {\n+  // Loose equality and unhandled promise\n+  if (payload.role == 1) {\n+    const res = await fetch('/api/admin');\n+    return res.json();\n+  }\n+  return null;\n+}\n"};
    let currentFilter = 'all';

    function init() {
      // 1. Populate Overall Score
      const s = data.score;
      document.getElementById('scoreNumber').textContent = s.overall;
      document.getElementById('gradeBadge').textContent = 'Grade ' + s.grade;
      document.getElementById('gradeBadge').className = 'gauge-grade grade-' + s.grade.charAt(0);
      document.getElementById('statusPill').textContent = s.status;
      document.getElementById('summaryText').textContent = s.summary;

      // Gauge offset animation (circumference = 2 * PI * 70 ~= 440)
      const circumference = 440;
      const offset = circumference - (s.overall / 100) * circumference;
      const circle = document.getElementById('gaugeCircle');
      circle.style.strokeDashoffset = offset;
      if (s.overall >= 80) circle.style.stroke = 'var(--success)';
      else if (s.overall >= 60) circle.style.stroke = 'var(--major)';
      else circle.style.stroke = 'var(--critical)';

      // 2. Meta Badges
      document.getElementById('targetSubtext').textContent = data.targetDescription;
      document.getElementById('statsFiles').textContent = data.stats.filesChanged + ' file(s)';
      document.getElementById('statsLines').textContent = '+' + data.stats.additions + ' / -' + data.stats.deletions;
      document.getElementById('statsRules').textContent = data.stats.rulesCheckedCount + ' rules checked';

      // 3. Category Bars
      const cats = [
        { label: '🛡️ Security', score: s.security.score },
        { label: '⚡ Performance', score: s.performance.score },
        { label: '🐛 Reliability', score: s.reliability.score },
        { label: '🧹 Clean Code', score: s.maintainability.score },
        { label: '📐 Rule Adherence', score: s.rulesAdherence.score },
      ];

      const catContainer = document.getElementById('categoryBars');
      catContainer.innerHTML = cats.map(c => {
        const color = c.score >= 80 ? 'var(--success)' : c.score >= 60 ? 'var(--major)' : 'var(--critical)';
        return `
          <div class="cat-row">
            <span class="cat-name">${c.label}</span>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${c.score}%; background: ${color};"></div>
            </div>
            <span class="cat-val">${c.score}%</span>
          </div>
        `;
      }).join('');

      // 4. Update Filter Counts
      const issues = data.issues || [];
      document.getElementById('countAll').textContent = issues.length;
      document.getElementById('countCrit').textContent = issues.filter(i => i.severity === 'critical').length;
      document.getElementById('countMaj').textContent = issues.filter(i => i.severity === 'major').length;
      document.getElementById('countMin').textContent = issues.filter(i => i.severity === 'minor').length;
      document.getElementById('countSugg').textContent = issues.filter(i => i.severity === 'suggestion').length;

      renderIssues();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.closest('.filter-btn').classList.add('active');
      renderIssues();
    }

    function renderIssues() {
      const container = document.getElementById('issuesList');
      const issues = (data.issues || []).filter(i => currentFilter === 'all' || i.severity === currentFilter);

      if (issues.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎉</div>
            <h3>No issues in this category!</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Code meets all best-practice checks.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = issues.map((issue, idx) => {
        const lineStr = issue.lineStart ? ':' + issue.lineStart + (issue.lineEnd ? '-' + issue.lineEnd : '') : '';
        return `
          <div class="issue-card ${escapeHtml(issue.severity)}">
            <div class="issue-header">
              <div class="issue-title-group">
                <div class="badge-row">
                  <span class="badge badge-${escapeHtml(issue.severity)}">${escapeHtml(issue.severity)}</span>
                  <span class="issue-loc">${escapeHtml(issue.file)}${lineStr}</span>
                  ${issue.ruleId ? `<span style="font-size: 11px; color: var(--text-muted);">[${escapeHtml(issue.ruleId)}]</span>` : ''}
                </div>
                <h4 class="issue-title">${escapeHtml(issue.title)}</h4>
              </div>
            </div>

            <div class="issue-body">
              <div class="problem-box">
                <strong>Problem:</strong> ${escapeHtml(issue.description)}
              </div>

              <div class="why-matters-box">
                <strong>⚠️ Why it matters:</strong> ${escapeHtml(issue.whyItMatters)}
              </div>

              ${(issue.codeSnippet || issue.fixedCodeSnippet) ? `
                <div class="code-comparison">
                  ${issue.codeSnippet ? `
                    <div class="code-pane">
                      <div class="pane-header bad">
                        <span>Original Issue</span>
                      </div>
                      <pre><code>${escapeHtml(issue.codeSnippet)}</code></pre>
                    </div>
                  ` : ''}
                  
                  ${issue.fixedCodeSnippet ? `
                    <div class="code-pane">
                      <div class="pane-header good">
                        <span>Recommended Fix</span>
                        <button class="copy-btn" data-copy-index="${idx}">Copy Fix</button>
                      </div>
                      <pre><code>${escapeHtml(issue.fixedCodeSnippet)}</code></pre>
                    </div>
                  ` : ''}
                </div>
              ` : ''}

              ${(!issue.fixedCodeSnippet && issue.suggestedFix) ? `
                <div style="font-size: 13px; color: #34d399;">
                  <strong>Fix Recommendation:</strong> ${escapeHtml(issue.suggestedFix)}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('[data-copy-index]').forEach(button => {
        button.addEventListener('click', () => {
          const index = Number(button.getAttribute('data-copy-index'));
          const snippet = issues[index]?.fixedCodeSnippet;
          if (typeof snippet === 'string') copySnippet(snippet);
        });
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function copySnippet(snippet) {
      navigator.clipboard.writeText(snippet);
      alert('Code fix copied to clipboard!');
    }

    function exportMarkdown() {
      // Build markdown representation
      let md = '# ⚡ RevAI Code Review Report\n\n';
      md += '> **Overall Score: ' + data.score.overall + '/100 (' + data.score.grade + ')**\n\n';
      md += data.score.summary + '\n\n';
      (data.issues || []).forEach((i, idx) => {
        md += '### #' + (idx + 1) + ' [' + i.severity.toUpperCase() + '] ' + i.title + '\n';
        md += '**File:** `' + i.file + '`\n\n';
        md += '**Problem:** ' + i.description + '\n\n';
        md += '**Why it matters:** ' + i.whyItMatters + '\n\n';
        if (i.fixedCodeSnippet) {
          md += '**Fix:**\n```\n' + i.fixedCodeSnippet + '\n```\n\n';
        }
      });
      navigator.clipboard.writeText(md);
      alert('Markdown PR comment copied to clipboard!');
    }

    window.onload = init;
  </script>
</body>
</html>
